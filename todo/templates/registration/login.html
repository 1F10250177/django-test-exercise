{% load static %}
<!DOCTYPE html>
<html lang="ja">

  <head>
    <title>ログイン - To Do Application</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
  </head>

  <body>
    <h1>ログイン</h1>
    {% if form.errors %}
    <p>ユーザー名またはパスワードが正しくありません。</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">ログイン</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
    <p><a href="{% url 'signup' %}">アカウントを作成する</a></p>
  </body>

</html>
